name: Orca RA Tests

# RA: Orca's own unit tests on every push to ra, beside (not blocking) the Windows build.
on:
  push:
    branches: [ra]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ra-test
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    # RA: keep independent Vitest shards below the old one-hour ceiling.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:ci
      - run: pnpm test --shard=${{ matrix.shard }}/4 --maxWorkers=2
